name: Rust and web

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Linux development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev
      - name: Verify original assets
        run: |
          bun tools/export_assets.ts --verify
          bun tools/export_catalog.ts --check
          bun tools/export_collision_events.ts --check
          bun tools/export_hub.ts --check
          bun tools/export_cinematics.ts --check
          bun tools/extract_templates.ts --check
          bun tools/audit_coverage.ts --check
      - name: Test build tools
        run: bun test tools
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build Linux application
        run: cargo build -p spelunky --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: spelunky-linux-x86_64
          path: |
            target/release/spelunky
            assets
            LICENSE
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Check Wasm application
        run: cargo check -p spelunky --lib --target wasm32-unknown-unknown --locked
      - name: Build static web bundle
        run: ./tools/build_web.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: spelunky-web
          path: web/dist
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
