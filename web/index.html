<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spelunky Classic · Unofficial Rust port</title>
  </head>
  <body>
    <p role="status">Loading Spelunky Classic…</p>
    <noscript>JavaScript is required to play Spelunky Classic.</noscript>

      bundle.hash = location.hash;
      location.replace(bundle.href);
