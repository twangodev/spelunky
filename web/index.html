<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spelunky Classic · Unofficial Rust port</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; background: #111; }
      body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; min-width: 0; min-height: 0; outline: none; touch-action: none; }
      #status { position: absolute; max-width: 36rem; padding: 1.25rem; text-align: center; }
      #status.error { background: #211813; border: 1px solid #b67d4a; }
      #attribution { position: absolute; right: .5rem; bottom: .3rem; margin: 0; font-size: .7rem; color: #ccc; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <canvas id="spelunky-canvas" tabindex="0" aria-label="Spelunky Classic game"></canvas>
    <p id="status" role="status">Loading Spelunky Classic…</p>
    <p id="attribution">Unofficial modified port · Derek Yu / Mossmouth · <a href="assets/COPYING.txt">License</a></p>
    <script type="module">
      const status = document.getElementById('status');
      try {
        if (!document.createElement('canvas').getContext('webgl2')) {
          throw new Error('WebGL 2 is required. Enable hardware acceleration or use a browser with WebGL 2 support.');
        }
        const { default: init, start } = await import('./pkg/spelunky.js');
        await init();
        await start();
        status.hidden = true;
        document.getElementById('spelunky-canvas').focus();
      } catch (error) {
        status.classList.add('error');
        status.textContent = `Spelunky could not start: ${error?.message ?? String(error)}`;
        console.error(error);
      }
    </script>
  </body>
</html>
