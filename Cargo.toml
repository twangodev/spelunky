[workspace]
members = ["crates/core", "crates/app", "crates/tools"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
spelunky-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.spelunky]
opt-level = 3
